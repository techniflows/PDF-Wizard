<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Wizard - 오프라인 모드</title>
  <meta name="application-name" content="PDF Wizard" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PDF Wizard" />
  <meta name="theme-color" content="#2563eb" />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    
    .container {
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.8;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
      opacity: 0.9;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .app-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
      text-decoration: none;
      display: inline-block;
    }
    
    .app-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    
    #status {
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
    
    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #2D3748 0%, #4A5568 100%);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📱</div>
    <h1>PDF Wizard</h1>
    <p>오프라인 모드에서 실행 중...</p>
    
    <div id="status">
      <div class="loading"></div>
      앱을 로드하고 있습니다...
    </div>
    
    <div style="margin-top: 30px;">
      <a href="/" class="app-btn">앱 시작하기</a>
      <button class="app-btn" onclick="window.location.reload()">새로고침</button>
    </div>
    
    <p style="font-size: 0.9rem; opacity: 0.7; margin-top: 20px;">
      모든 PDF 기능이 오프라인에서 완전히 작동합니다.<br>
      파일은 절대 서버로 전송되지 않습니다.
    </p>
  </div>

  <script>
    console.log('📱 Offline page loaded');
    
    // Function to try loading the main app
    function tryLoadMainApp() {
      console.log('🔄 Attempting to load main app...');
      
      // Create a hidden iframe to test if the main app can load
      const testFrame = document.createElement('iframe');
      testFrame.style.display = 'none';
      testFrame.src = '/';
      
      testFrame.onload = () => {
        console.log('✅ Main app loaded successfully, redirecting...');
        window.location.href = '/';
      };
      
      testFrame.onerror = () => {
        console.log('❌ Main app failed to load');
        document.getElementById('status').innerHTML = '⚠️ 앱을 로드할 수 없습니다. 인터넷 연결을 확인해주세요.';
      };
      
      document.body.appendChild(testFrame);
      
      // Remove test frame after timeout
      setTimeout(() => {
        if (testFrame.parentNode) {
          testFrame.parentNode.removeChild(testFrame);
        }
      }, 5000);
    }
    
    // Check service worker status and try to load app
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration('/').then(registration => {
        if (registration && registration.active) {
          console.log('✅ Service Worker is active');
          tryLoadMainApp();
        } else {
          console.log('⏳ Registering Service Worker...');
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('✅ Service Worker registered');
            // Wait a bit for SW to activate then try loading app
            setTimeout(tryLoadMainApp, 2000);
          }).catch(error => {
            console.error('❌ Service Worker registration failed:', error);
            document.getElementById('status').innerHTML = '⚠️ 서비스 워커를 로드할 수 없습니다.';
          });
        }
      }).catch(error => {
        console.error('❌ Error checking Service Worker:', error);
        tryLoadMainApp(); // Try anyway
      });
    } else {
      console.log('⚠️ Service Worker not supported');
      document.getElementById('status').innerHTML = '⚠️ 이 브라우저는 오프라인 기능을 지원하지 않습니다.';
    }
    
    // Listen for online event
    window.addEventListener('online', () => {
      console.log('🌐 Back online, redirecting...');
      window.location.href = '/';
    });
    
    // If we're actually online, redirect immediately
    if (navigator.onLine) {
      console.log('🌐 Already online, redirecting...');
      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    }
  </script>
</body>
</html>
