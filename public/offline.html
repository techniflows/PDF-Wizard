<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>PDF Wizard</title>
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #171717;
      --muted: #525252;
      --link: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0a;
        --foreground: #f5f5f5;
        --muted: #a3a3a3;
        --link: #60a5fa;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 16px;
      box-sizing: border-box;
      background: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
      line-height: 1.6;
    }

    main {
      width: 100%;
      max-width: 48rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    p {
      margin: 0 0 4px;
      color: var(--muted);
    }

    a {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 0;
      color: var(--link);
    }
  </style>
</head>
<body>
  <main>
    <h1>PDF Wizard</h1>
    <p>This page is not available offline.</p>
    <p lang="ko">오프라인에서는 이 페이지를 열 수 없습니다.</p>
    <a href="">Retry / <span lang="ko">다시 시도</span></a>
  </main>
</body>
</html>
