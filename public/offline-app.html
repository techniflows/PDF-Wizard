<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF Wizard - 오프라인 모드</title>
  <meta name="application-name" content="PDF Wizard" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PDF Wizard" />
  <meta name="theme-color" content="#2563eb" />
  
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    
    .container {
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }
    
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
      opacity: 0.8;
    }
    
    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      font-weight: 600;
    }
    
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
      opacity: 0.9;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .app-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      color: white;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px;
      text-decoration: none;
      display: inline-block;
    }
    
    .app-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }
    
    #status {
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📱</div>
    <h1>PDF Wizard</h1>
    <p>오프라인 모드에서 실행 중...</p>
    
    <div id="status">
      <div class="loading"></div>
      앱을 로드하고 있습니다...
    </div>
    
    <div style="margin-top: 30px;">
      <a href="/" class="app-btn">앱 시작하기</a>
      <button class="app-btn" onclick="window.location.reload()">새로고침</button>
    </div>
    
    <p style="font-size: 0.9rem; opacity: 0.7; margin-top: 20px;">
      모든 PDF 기능이 오프라인에서 완전히 작동합니다.<br>
      파일은 절대 서버로 전송되지 않습니다.
    </p>
  </div>

  <script>
    // Auto-redirect to main app after a short delay
    setTimeout(() => {
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        // Service worker is active, redirect to main app
        window.location.href = '/';
      } else {
        // Try to register service worker and then redirect
        navigator.serviceWorker.register('/sw.js').then(() => {
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        }).catch(() => {
          document.getElementById('status').innerHTML = '⚠️ 서비스 워커를 로드할 수 없습니다. 수동으로 앱을 시작해주세요.';
        });
      }
    }, 2000);
    
    // Listen for online event
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
    
    // Check if we're actually online
    if (navigator.onLine) {
      setTimeout(() => {
        window.location.href = '/';
      }, 500);
    }
  </script>
</body>
</html>
